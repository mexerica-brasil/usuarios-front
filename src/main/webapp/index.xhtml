<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:faces="jakarta.faces"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
	  lang="pt">

	<f:view>
		<h:head>
			<title>JSF - Myfaces Example</title>
			<link rel="stylesheet" type="text/css" href="css/detail.css"/>
		</h:head>

		<f:metadata>
			<f:event listener="#{beanUsuarios.preRenderView()}" type="preRenderView"/>
		</f:metadata>
			
		<h:body>
			<h:form id="form">
				<p:growl id="globalMessage" widgetVar="w_globalMessage" globalOnly="true" autoUpdate="true" closable="true"/>
				

				<div class="page-container">
					<div class="page-header">
						<div>
							<h1 class="page-title">#{label.gerencia}</h1>
						</div>
					</div>

					<div class="card">
						<p:toolbar>
            				<p:toolbarGroup>
								<p:commandButton value="#{label.incluir}" icon="pi pi-plus" actionListener="#{beanUsuarios.incluir}"
									update=":dialogs:manage-usuario-content" oncomplete="PF('varDialogUsuario').show()"
									styleClass="ui-button-success" style="margin-right: .5rem">
									<p:resetInput target=":dialogs:manage-usuario-content" />
								</p:commandButton>
							</p:toolbarGroup>	
						</p:toolbar>
						
						<p:dataTable id="dtUsuarios" widgetVar="varUsuarios" var="usuario" value="#{beanUsuarios.usuarios}"
							reflow="true" styleClass="products-table" 
							rowKey="#{usuario.id}" paginator="true" rows="7" selectionRowMode="add" paginatorPosition="bottom">
							<f:facet name="header">
								<div class="products-table-header">
									<table style="width: 100%; border: none;">
        								<tr>
            								<td style="text-align: left; border: none;">
												<span style="font-weight: bold">#{label.usuarios}</span>
											</td>
											 <td style="text-align: right; border: none;">
												<span class="filter-container ui-input-icon-left"> <i class="pi pi-search"></i>
													<p:inputText id="globalFilter" onkeyup="PrimeFaces.debounce(() => PF('varUsuarios').filter())" placeholder="#{label.pesquisa}" />
												</span>
											 </td>	 
										</tr>
									</table>
								</div>
							</f:facet>
							<p:column headerText="#{label.codigo}" sortBy="#{usuario.id}" filterBy="#{usuario.id}">
								<h:outputText value="#{usuario.id}" />
							</p:column>
							<p:column headerText="#{label.nome}" sortBy="#{usuario.nome}" filterBy="#{usuario.nome}">
								<h:outputText value="#{usuario.nome}" />
							</p:column>
							<p:column headerText="#{label.dataNascimento}" sortBy="#{usuario.dataNascimento}" filterBy="#{usuario.dataNascimento}">
								<h:outputText value="#{usuario.dataNascimentoFormatada}" />
							</p:column>
							<p:column headerText="#{label.cpf}" sortBy="#{usuario.cpf}" filterBy="#{usuario.cpf}">
								<h:outputText value="#{usuario.cpf}" converter="cpfConverter"/>
							</p:column>
							<p:column exportable="false" ariaHeaderText="#{label.acoes}">
								<p:commandButton icon="pi pi-pencil" update="@([id$=manage-usuario-content])"
									oncomplete="PF('varDialogUsuario').show()"
									styleClass="edit-button rounded-button ui-button-success" process="@this">
									<f:setPropertyActionListener value="#{usuario}" target="#{beanUsuarios.selectedUsuario}" />
									<p:resetInput target=":dialogs:manage-usuario-content" />
								</p:commandButton>
							</p:column>
						</p:dataTable>			
					</div>
				</div>

			</h:form>

			<h:form id="dialogs">
				<p:dialog id = "detail" header="#{label.usuariosDetalhes}" showEffect="fade" modal="true" widgetVar="varDialogUsuario"
					responsive="true">
					<p:outputPanel id="manage-usuario-content">
						<p:outputPanel rendered="#{not empty beanUsuarios.selectedUsuario}">
							<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
								<p:outputLabel for="codigo">#{label.codigo}</p:outputLabel>
								<p:inputText id="codigo" value="#{beanUsuarios.selectedUsuario.id}" readonly="true" maxlength="3" size="10"/>
							</div>
							<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
								<p:outputLabel for="nome">#{label.nome}</p:outputLabel>
								<p:inputText id="nome" value="#{beanUsuarios.selectedUsuario.nome}" maxlength="100" size="46" label="#{label.nome}">
									<p:keyFilter regEx="/[a-zA-Z\s]/"/>
								</p:inputText>
								<p:message for="nome" display="text"/>
							</div>
							<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
								<p:outputLabel for="dataNascimento">#{label.dataNascimento}</p:outputLabel>
								<p:calendar id="dataNascimento" value="#{beanUsuarios.selectedUsuario.dataNascimento}"
									mode="popup" pattern="dd/MM/yyyy" locale="pt_BR"
									navigator="true" showButtonPanel="true" showOn="button" mask="true"
									readonlyInput="true" size="14"
									autocomplete="off" styleClass="Fleft" label="#{label.dataNascimento}">
								</p:calendar>
								<p:message for="dataNascimento" display="text"/> 
							</div>
							<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
								<p:outputLabel for="cpf">#{label.cpf}</p:outputLabel>
								<p:inputMask id="cpf" value="#{beanUsuarios.selectedUsuario.cpf}" mask="999.999.999-99"
									maxlength="14" size="14" label="#{label.cpf}" converter="cpfConverter"/>
								<p:message for="cpf" display="text"/>
							</div>
							<p:divider>
								<span style="font-weight: 600;">#{label.endereco}</span>
							</p:divider>
							<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
								<p:outputLabel for="logradouro">#{label.logradouro}</p:outputLabel>
								<p:inputText id="logradouro" value="#{beanUsuarios.selectedUsuario.endereco.logradouro}" 
									maxlength="200" size="46" label="#{label.logradouro}">
									<p:keyFilter regEx="/[a-zA-Z\s]/"/>
								</p:inputText>
								<p:message for="logradouro" display="text"/>
							</div>
							<div style="display: flex; align-items: flex-start; gap: 110px;">
								<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
										<p:outputLabel for="numero">#{label.numero}</p:outputLabel>
										<p:inputText id="numero" value="#{beanUsuarios.selectedUsuario.endereco.numero}" label="#{label.numero}"
											maxlength="6" size="14">
											<p:keyFilter regEx="/[0-9]/"/>
										</p:inputText>
										<p:message for="numero" display="text"/>	
								</div>
								<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
										<p:outputLabel for="cep">#{label.cep}</p:outputLabel>
										<p:inputMask id="cep" value="#{beanUsuarios.selectedUsuario.endereco.cep}" mask="99999-999" 
											maxlength="9" size="14" label="#{label.cep}"/>
										<p:message for="cep" display="text"/>	
								</div>
							</div>
							<div style="display: flex; align-items: flex-start; gap: 110px;">
								<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
									<p:outputLabel for="cidade">#{label.cidade}</p:outputLabel>
									<p:inputText id="cidade" value="#{beanUsuarios.selectedUsuario.endereco.cidade}" label="#{label.cidade}"
										maxlength="100" size="14">
										<p:keyFilter regEx="/[a-zA-Z\s]/"/>
									</p:inputText>
									<p:message for="cidade" display="text"/>
								</div>
								
								<div class="field" style="display: flex; flex-direction: column; align-items: flex-start;">
									<p:outputLabel for="uf">#{label.uf}</p:outputLabel>
									<p:inputText id="uf" value="#{beanUsuarios.selectedUsuario.endereco.uf}" label="#{label.uf}"
										maxlength="2" size="14">
										<p:keyFilter regEx="/[A-Z]/"/>
									</p:inputText>
									<p:message for="uf" display="text"/>
								</div>
							</div>
						</p:outputPanel>	
					</p:outputPanel>	
					<f:facet name="footer">
						<p:commandButton value="#{label.salvar}" icon="pi pi-check" actionListener="#{beanUsuarios.salvar}"
							update="@([id$=manage-usuario-content])" process="@([id$=manage-usuario-content]) @this"/>
						<p:commandButton value="#{label.cancelar}" icon="pi pi-times" onclick="PF('varDialogUsuario').hide()"
							class="ui-button-secondary" type="button" />
					</f:facet>
				</p:dialog>
			</h:form>	

		</h:body>
	</f:view>
</html>
